name: Analyze DEX and cl.zip contents
on:
  workflow_dispatch:
  push:
    paths:
      - "classes*.dex"
      - "cl.zip"
      - ".github/workflows/dex-analysis.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools and resolve Baksmali
        run: |
          sudo apt-get update
          sudo apt-get install -y maven unzip file
          cat > pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.analysis</groupId>
            <artifactId>dex-analysis</artifactId>
            <version>1.0</version>
            <dependencies>
              <dependency>
                <groupId>org.smali</groupId>
                <artifactId>baksmali</artifactId>
                <version>2.5.2</version>
              </dependency>
            </dependencies>
          </project>
          POM
          mvn -q dependency:copy-dependencies -DoutputDirectory=target/dependency

      - name: Disassemble DEX and inspect cl.zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smali-work result cl-unpacked
          shopt -s nullglob
          for dex in classes*.dex; do
            name="${dex%.dex}"
            mkdir -p "smali-work/$name"
            java -cp "target/dependency/*" org.jf.baksmali.Main disassemble "$dex" -o "smali-work/$name"
          done

          if [ -f cl.zip ]; then
            echo "=== cl.zip archive listing ===" > result/analysis.txt
            unzip -l cl.zip >> result/analysis.txt
            unzip -oq cl.zip -d cl-unpacked
            echo >> result/analysis.txt
            echo "=== cl.zip file types ===" >> result/analysis.txt
            find cl-unpacked -type f -print0 | xargs -0 -r file >> result/analysis.txt
          else
            echo "cl.zip not present" > result/analysis.txt
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          needles = [
              b"ROLEXTIME",
              b"Max time during Night Sequence",
              b"Night Sequence",
          ]
          roots = [Path("smali-work"), Path("cl-unpacked")]
          out = []
          for root in roots:
              if not root.exists():
                  continue
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  try:
                      data = p.read_bytes()
                  except Exception:
                      continue
                  hits = []
                  variants = [data]
                  for enc in ("utf-16le", "utf-16be"):
                      try:
                          variants.append(data.decode(enc, errors="ignore").encode("utf-8"))
                      except Exception:
                          pass
                  for needle in needles:
                      if any(needle.lower() in v.lower() for v in variants):
                          hits.append(needle.decode("ascii", errors="replace"))
                  if hits:
                      out.append(f"FILE: {p}")
                      out.append("MATCHES: " + ", ".join(hits))
                      if p.suffix == ".smali":
                          out.append(data.decode("utf-8", errors="replace"))
                      else:
                          for needle in needles:
                              pos = data.lower().find(needle.lower())
                              if pos >= 0:
                                  chunk = data[max(0,pos-160):pos+len(needle)+240]
                                  out.append("BYTES: " + repr(chunk))
                      out.append("")
          with Path("result/analysis.txt").open("a", encoding="utf-8") as f:
              f.write("\n=== TARGET STRING SEARCH ===\n")
              f.write("\n".join(out) if out else "No target strings found in DEX or cl.zip contents.")
              f.write("\n")
          print("Inspection complete.")
          PY

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: rec-analysis
          path: result/analysis.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit analysis text to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result/analysis.txt
          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
          else
            git commit -m "Inspect cl.zip and DEX contents"
            git push
          fi
