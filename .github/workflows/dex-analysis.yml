name: Analyze game files
on:
  workflow_dispatch:
  push:
    paths:
      - "classes*.dex"
      - "cl.zip"
      - "sdr.zip"
      - ".github/workflows/dex-analysis.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools and resolve Baksmali
        run: |
          sudo apt-get update
          sudo apt-get install -y maven unzip file
          cat > pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.analysis</groupId>
            <artifactId>dex-analysis</artifactId>
            <version>1.0</version>
            <dependencies>
              <dependency>
                <groupId>org.smali</groupId>
                <artifactId>baksmali</artifactId>
                <version>2.5.2</version>
              </dependency>
            </dependencies>
          </project>
          POM
          mvn -q dependency:copy-dependencies -DoutputDirectory=target/dependency

      - name: Inspect DEX and uploaded archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smali-work result cl-unpacked sdr-unpacked
          shopt -s nullglob
          for dex in classes*.dex; do
            name="${dex%.dex}"
            mkdir -p "smali-work/$name"
            java -cp "target/dependency/*" org.jf.baksmali.Main disassemble "$dex" -o "smali-work/$name"
          done

          {
            echo "=== UPLOADED ARCHIVE CONTENTS ==="
            for archive in cl.zip sdr.zip; do
              if [ -f "$archive" ]; then
                echo
                echo "### $archive"
                unzip -l "$archive"
              fi
            done
          } > result/analysis.txt

          [ ! -f cl.zip ] || unzip -oq cl.zip -d cl-unpacked
          [ ! -f sdr.zip ] || unzip -oq sdr.zip -d sdr-unpacked

          {
            echo
            echo "=== FILE TYPES IN sdr.zip ==="
            find sdr-unpacked -type f -print0 | xargs -0 -r file | head -n 500
          } >> result/analysis.txt

          python3 - <<'PY'
          from pathlib import Path
          needles = [
              b"ROLEXTIME",
              b"Max time during Night Sequence",
              b"Night Sequence",
              b"max_time",
              b"night_sequence",
          ]
          roots = [Path("smali-work"), Path("cl-unpacked"), Path("sdr-unpacked")]
          out = []
          for root in roots:
              if not root.exists():
                  continue
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  try:
                      data = p.read_bytes()
                  except Exception:
                      continue
                  variants = [data]
                  for enc in ("utf-16le", "utf-16be"):
                      try:
                          variants.append(data.decode(enc, errors="ignore").encode("utf-8"))
                      except Exception:
                          pass
                  hits = [n.decode("ascii") for n in needles if any(n.lower() in v.lower() for v in variants)]
                  if hits:
                      out.append(f"FILE: {p}")
                      out.append("MATCHES: " + ", ".join(hits))
                      if p.suffix.lower() in {".gd", ".tscn", ".tres", ".cfg", ".json", ".txt", ".translation", ".csv"}:
                          out.append(data[:12000].decode("utf-8", errors="replace"))
                      out.append("")
          with Path("result/analysis.txt").open("a", encoding="utf-8") as f:
              f.write("\\n=== TARGET STRING SEARCH ===\\n")
              f.write("\\n".join(out) if out else "No target strings found in inspected files.")
              f.write("\\n")
          print("Inspection complete.")
          PY

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: rec-analysis
          path: result/analysis.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit analysis text to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result/analysis.txt
          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
          else
            git commit -m "Inspect Godot game assets"
            git push
          fi
